# /etc/fail2ban/jail.d/lebprime.conf - login throttling for SSH and the dashboard login gate.
[sshd]
enabled  = true
maxretry = 4
findtime = 10m
bantime  = 1h

[lebprime-auth]
enabled  = true
port     = http,https
filter   = lebprime-auth
backend  = systemd
journalmatch = _SYSTEMD_UNIT=lebprime-auth.service
maxretry = 8
findtime = 30m
bantime  = 6h
