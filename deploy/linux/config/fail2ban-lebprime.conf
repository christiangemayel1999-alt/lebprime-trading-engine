# /etc/fail2ban/jail.d/lebprime.conf - login throttling for SSH and the dashboard.
[sshd]
enabled  = true
maxretry = 4
findtime = 10m
bantime  = 1h

[lebprime-dashboard]
enabled  = true
port     = http,https
filter   = lebprime-dashboard
logpath  = /var/log/caddy/lebprime-access.log
backend  = auto
maxretry = 6
findtime = 10m
bantime  = 2h
