# /run is a tmpfs: this directory (and the boot-guard marker inside it) disappears on every reboot.
d /run/lebprime 0770 lebprime lebprime -
# Gateway arm switch: the "armed" file inside is created by lebprime-ctl arm (or the watchdog after a
# dashboard Resume) and vanishes on reboot, so new trades need an explicit resume after every boot.
d /run/lebprime-gateway 0750 root lebprime-mt5 -
