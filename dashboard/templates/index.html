{% extends "base.html" %}
{% block body %}
<main class="container-fluid py-3 workspace">
    <div id="connection-banner" role="status" class="connection-banner" hidden>Connection lost, retrying…</div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div>
            <h1 class="h3 mb-1">Your trading workspace</h1>
            <div class="text-secondary">Monitor execution, review results and manage your demo workspace.</div>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center" id="top-status-bar"></div>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-body d-flex flex-wrap gap-2 justify-content-between align-items-center">
                    <button class="btn btn-outline-light" id="open-controls">Controls</button>
                    <dialog id="controls-sheet"><div class="sheet-heading"><h2>Demo controls</h2><button id="close-controls" class="btn btn-outline-light">Close</button></div><p>Actions affect the demo bot. Review each confirmation.</p><div id="quick-actions" class="controls-grid"></div></dialog>
                    <div class="small text-secondary" id="save-feedback">Ready.</div>
                </div>
            </div>
        </div>
    </div>
    <button id="mobile-navigation" class="btn btn-outline-light" aria-controls="dashboard-tabs" aria-expanded="false">Menu · Overview</button>
    <ul class="nav nav-pills mb-3 flex-wrap gap-2" id="dashboard-tabs">
        <li class="nav-item"><button class="nav-link active" id="tab-overview" data-section="overview">Overview</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-strategies" data-section="strategies">Strategies</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-indicator-lab" data-section="indicator-lab">Indicator Lab</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-trades" data-section="trades">Trades</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-performance" data-section="performance">Performance</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-risk" data-section="risk">Risk Management</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-config" data-section="config">Settings</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-system" data-section="system">System</button></li>
    </ul>
    <div id="section-overview" class="dashboard-section" data-dashboard-section="overview"></div>
    <div id="section-strategies" class="dashboard-section d-none" data-dashboard-section="strategies"></div>
    <div id="section-indicator-lab" class="dashboard-section d-none" data-dashboard-section="indicator-lab"></div>
    <div id="strategy-test-panel" class="d-none"></div>
    <div id="time-machine-panel" class="d-none"></div>
    <div id="section-trades" class="dashboard-section d-none" data-dashboard-section="trades"></div>
    <div id="section-performance" class="dashboard-section d-none" data-dashboard-section="performance"></div>
    <div id="section-risk" class="dashboard-section d-none" data-dashboard-section="risk"></div>
    <div id="section-config" class="dashboard-section d-none" data-dashboard-section="config"></div>
    <div id="section-system" class="dashboard-section d-none" data-dashboard-section="system">
        <div id="section-health" class="mb-3"></div>
        <div id="section-alerts" class="mb-3"></div>
        <div id="section-logs"></div>
    </div>
</main>
<script src="{{ url_for('static', path='/strategy_tests.js') }}" defer></script>
<script src="{{ url_for('static', path='/time_machine.js') }}" defer></script>
{% endblock %}
