<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trading Bot Control Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/dashboard.css') }}" rel="stylesheet">
</head>
<body>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.__INITIAL_CONFIG__ = {{ initial_config|safe if initial_config else '{}' }};
        window.__INITIAL_STATUS__ = {{ initial_status|safe if initial_status else '{}' }};
        window.__DASHBOARD_AUTH__ = {{ dashboard_auth|safe if dashboard_auth else '{}' }};
    </script>
    <script src="{{ url_for('static', path='/dashboard.js') }}"></script>
</body>
</html>
